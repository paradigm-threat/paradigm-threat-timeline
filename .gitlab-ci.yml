# GitLab Pages — static mirror of the repo (same idea as .github/workflows/static.yml on GitHub).
# Set the project default branch in GitLab (e.g. main) to match $CI_DEFAULT_BRANCH.

image: alpine:latest

pages:
  stage: deploy
  before_script:
    - apk add --no-cache rsync
  script:
    - mkdir -p public
    - rsync -a --exclude='.git/' ./ public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
