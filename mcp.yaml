name: paradigm-threat-timeline
version: "0.1.0"
tools:
  search_site:
    description: Keyword search over timeline events via Relay QUERY / sqlite plugin. Prefer a short stem; overlapping forms (iran iranian) are collapsed. Default 20 slim hits.
    aliases: [search]
    via: query
    collection: index
  get_event_dates:
    description: Timeline event dates (project signed year) and elapsed / blip-adjusted years
    via: query
    collection: index
  research_status:
    description: Coverage envelope for a timeline question (QUERY primary events collection)
    via: research_status
    collection: index
  read_article:
    description: Read a content markdown blob by repo-relative path
    aliases: [fetch]
    via: git_read
