<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1357 500" width="1357" height="500">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="1" x2="0%" y2="0">
      <stop offset="0%" stop-color="#666" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#999" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1357" height="500" fill="#f5f4f0"/>

  <!-- Scale: y = 360 - (days-200)/180 * 280. Extended range 200-380 for padding. -->
  <!-- 200->360, 225->321, 240->298, 260->267, 273->246, 360->111, 365->103, 380->80 -->

  <!-- Dark Age highlight: 3147 BC to 747 BC -->
  <rect x="335" y="80" width="583" height="280" fill="#999" fill-opacity="0.12"/>

  <!-- Grid lines (200, 225, 260, 300, 340, 365, 380 - extra markers for padding) -->
  <line x1="100" y1="360" x2="1277" y2="360" stroke="#ccc" stroke-width="1"/>
  <line x1="100" y1="321" x2="1277" y2="321" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="267" x2="1277" y2="267" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="204" x2="1277" y2="204" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="142" x2="1277" y2="142" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="103" x2="1277" y2="103" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="80" x2="1277" y2="80" stroke="#ccc" stroke-width="1"/>

  <!-- Y-axis labels (225, 260, 300, 340, 365) -->
  <text x="85" y="326" text-anchor="end" font-size="14" fill="#333">225</text>
  <text x="85" y="272" text-anchor="end" font-size="14" fill="#333">260</text>
  <text x="85" y="209" text-anchor="end" font-size="14" fill="#333">300</text>
  <text x="85" y="147" text-anchor="end" font-size="14" fill="#333">340</text>
  <text x="85" y="108" text-anchor="end" font-size="14" fill="#333">365</text>
  <text x="50" y="220" text-anchor="middle" font-size="13" fill="#444" transform="rotate(-90, 50, 220)">days/year</text>

  <!-- Step chart: accurate positions on extended scale -->
  <!-- 225d=321, 240d=298, 260d=267, 273d=246, 360d=111, 365.24d=103 -->
  <polyline points="100,321 335,321 335,298 502,298 502,267 586,267 586,246 752,246 752,111 918,111 918,103 1277,103"
    fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  <polygon points="100,321 335,321 335,298 502,298 502,267 586,267 586,246 752,246 752,111 918,111 918,103 1277,103 1277,360 100,360"
    fill="url(#fillGrad)"/>

  <!-- X-axis ticks and labels (x-axis at y=360) -->
  <line x1="100" y1="360" x2="100" y2="370" stroke="#999" stroke-width="1"/>
  <text x="100" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">4077 BC</text>
  <text x="100" y="415" text-anchor="middle" font-size="13" fill="#333">Creation</text>
  <text x="100" y="435" text-anchor="middle" font-size="12" fill="#444">225 d</text>

  <line x1="335" y1="360" x2="335" y2="370" stroke="#999" stroke-width="1"/>
  <text x="335" y="385" text-anchor="middle" font-size="14" fill="#222">3147 BC</text>
  <text x="335" y="403" text-anchor="middle" font-size="12" fill="#444">Golden Age ended</text>
  <text x="335" y="421" text-anchor="middle" font-size="12" fill="#444">World Flood</text>
  <text x="335" y="441" text-anchor="middle" font-size="12" fill="#444">240 d</text>

  <line x1="502" y1="360" x2="502" y2="370" stroke="#999" stroke-width="1"/>
  <text x="502" y="385" text-anchor="middle" font-size="14" fill="#222">2349 BC</text>
  <text x="502" y="403" text-anchor="middle" font-size="12" fill="#444">Moon appears</text>
  <text x="502" y="441" text-anchor="middle" font-size="12" fill="#444">260 d</text>

  <line x1="586" y1="360" x2="586" y2="370" stroke="#999" stroke-width="1"/>
  <text x="586" y="385" text-anchor="middle" font-size="14" fill="#222">2193 BC</text>
  <text x="586" y="403" text-anchor="middle" font-size="12" fill="#444">Fall of Akkad</text>
  <text x="586" y="441" text-anchor="middle" font-size="12" fill="#444">273 d</text>

  <line x1="752" y1="360" x2="752" y2="370" stroke="#999" stroke-width="1"/>
  <text x="752" y="385" text-anchor="middle" font-size="14" fill="#222">1492 BC</text>
  <text x="752" y="403" text-anchor="middle" font-size="12" fill="#444">last contact with Venus</text>
  <text x="752" y="421" text-anchor="middle" font-size="12" fill="#444">Exodus</text>
  <text x="752" y="441" text-anchor="middle" font-size="12" fill="#444">360 d</text>

  <line x1="918" y1="360" x2="918" y2="370" stroke="#999" stroke-width="1"/>
  <text x="918" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">747 BC</text>
  <text x="918" y="403" text-anchor="middle" font-size="12" fill="#444">last contact with Mars</text>
  <text x="918" y="421" text-anchor="middle" font-size="12" fill="#444">Nabonassar</text>
  <text x="918" y="441" text-anchor="middle" font-size="12" fill="#444">365.24 d</text>

  <line x1="1277" y1="360" x2="1277" y2="370" stroke="#999" stroke-width="1"/>
  <text x="1277" y="395" text-anchor="middle" font-size="14" fill="#333">today</text>

  <text x="626" y="95" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Dark Age (3147–747 BC)</text>

  <text x="688" y="50" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Year-Length Through Antiquity</text>
  <text x="688" y="72" text-anchor="middle" font-size="14" fill="#444">Electromagnetic close-encounters forced orbital jumps; each jump lengthened the year</text>
</svg>
