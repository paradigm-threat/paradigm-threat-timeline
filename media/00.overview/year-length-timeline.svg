<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1357 480" width="1357" height="480">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="1" x2="0%" y2="0">
      <stop offset="0%" stop-color="#666" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#999" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background: book-page cream for visibility in light and dark mode -->
  <rect width="1357" height="480" fill="#f5f4f0"/>

  <!-- Chart area: margins 100 left, 80 right, 80 top, 120 bottom -->
  <!-- Graph: x 100-1277, y 80-360 (280px height) -->
  <!-- Y: 225 days = bottom (360), 365 days = top (80) -->
  <!-- X: 4077 BC = 100, 3147 = 335, 2349 = 502, 2193 = 586, 1492 = 752, 747 = 918, today = 1277 -->

  <!-- Grid lines (horizontal, for days) -->
  <line x1="100" y1="360" x2="1277" y2="360" stroke="#ccc" stroke-width="1"/>
  <line x1="100" y1="296" x2="1277" y2="296" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="232" x2="1277" y2="232" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="168" x2="1277" y2="168" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="80" x2="1277" y2="80" stroke="#ccc" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="85" y="365" text-anchor="end" font-size="11" fill="#333">225</text>
  <text x="85" y="301" text-anchor="end" font-size="11" fill="#333">260</text>
  <text x="85" y="237" text-anchor="end" font-size="11" fill="#333">300</text>
  <text x="85" y="173" text-anchor="end" font-size="11" fill="#333">340</text>
  <text x="85" y="85" text-anchor="end" font-size="11" fill="#333">365</text>
  <text x="50" y="220" text-anchor="middle" font-size="10" fill="#444" transform="rotate(-90, 50, 220)">days/year</text>

  <!-- Step chart: sharp jumps. y = 360 - (days-225)/140 * 280 -->
  <!-- 225->360, 240->330, 260->290, 273->264, 360->90, 365->80 -->
  <polyline points="100,360 335,360 335,330 502,330 502,290 586,290 586,264 752,264 752,90 918,90 918,80 1277,80"
    fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Fill under line -->
  <polygon points="100,360 335,360 335,330 502,330 502,290 586,290 586,264 752,264 752,90 918,90 918,80 1277,80 1277,360 100,360"
    fill="url(#fillGrad)"/>

  <!-- X-axis labels and annotations -->
  <line x1="100" y1="360" x2="100" y2="370" stroke="#999" stroke-width="1"/>
  <text x="100" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">4077 BC</text>
  <text x="100" y="415" text-anchor="middle" font-size="10" fill="#333">Creation</text>
  <text x="100" y="432" text-anchor="middle" font-size="9" fill="#444">225 d</text>

  <line x1="335" y1="360" x2="335" y2="370" stroke="#999" stroke-width="1"/>
  <text x="335" y="395" text-anchor="middle" font-size="11" fill="#222">3147 BC</text>
  <text x="335" y="412" text-anchor="middle" font-size="9" fill="#444">World Flood</text>
  <text x="335" y="432" text-anchor="middle" font-size="9" fill="#444">240 d</text>

  <line x1="502" y1="360" x2="502" y2="370" stroke="#999" stroke-width="1"/>
  <text x="502" y="395" text-anchor="middle" font-size="11" fill="#222">2349 BC</text>
  <text x="502" y="412" text-anchor="middle" font-size="9" fill="#444">Moon appears</text>
  <text x="502" y="432" text-anchor="middle" font-size="9" fill="#444">260 d</text>

  <line x1="586" y1="360" x2="586" y2="370" stroke="#999" stroke-width="1"/>
  <text x="586" y="395" text-anchor="middle" font-size="11" fill="#222">2193 BC</text>
  <text x="586" y="412" text-anchor="middle" font-size="9" fill="#444">Fall of Akkad</text>
  <text x="586" y="432" text-anchor="middle" font-size="9" fill="#444">273 d</text>

  <line x1="752" y1="360" x2="752" y2="370" stroke="#999" stroke-width="1"/>
  <text x="752" y="395" text-anchor="middle" font-size="11" fill="#222">1492 BC</text>
  <text x="752" y="412" text-anchor="middle" font-size="9" fill="#444">Exodus</text>
  <text x="752" y="432" text-anchor="middle" font-size="9" fill="#444">360 d</text>

  <line x1="918" y1="360" x2="918" y2="370" stroke="#999" stroke-width="1"/>
  <text x="918" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">747 BC</text>
  <text x="918" y="412" text-anchor="middle" font-size="9" fill="#444">Nabonassar</text>
  <text x="918" y="432" text-anchor="middle" font-size="9" fill="#444">365.24 d</text>

  <line x1="1277" y1="360" x2="1277" y2="370" stroke="#999" stroke-width="1"/>
  <text x="1277" y="395" text-anchor="middle" font-size="11" fill="#333">today</text>

  <!-- Title -->
  <text x="688" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Year-Length Through Antiquity</text>
  <text x="688" y="68" text-anchor="middle" font-size="11" fill="#444">Electromagnetic close-encounters forced orbital jumps; each jump lengthened the year</text>
</svg>
