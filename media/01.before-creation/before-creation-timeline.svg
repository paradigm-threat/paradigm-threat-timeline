<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 200" width="1180" height="200">
  <defs>
    <linearGradient id="timelineBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a4a5a"/>
      <stop offset="100%" stop-color="#6a6a7a"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8a9aac"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1180" height="200" fill="#1a1a2e"/>

  <!-- Arrow to infinity (undatable past before 4077 BC) - points left -->
  <line x1="400" y1="100" x2="50" y2="100" stroke="#6a7a8a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <line x1="50" y1="100" x2="30" y2="100" stroke="#5a6a7a" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="25" y="98" text-anchor="middle" font-size="18" fill="#6a7a8a" font-style="italic">&#x221E;</text>
  <text x="220" y="85" text-anchor="middle" font-size="12" fill="#a0a0b0">Before 4077 BC</text>
  <text x="220" y="102" text-anchor="middle" font-size="10" fill="#707080">real memories, undatable</text>
  <text x="220" y="118" text-anchor="middle" font-size="9" fill="#606070">no timekeeping possible</text>

  <!-- Main timeline: undatable segment to 4077 BC -->
  <line x1="400" y1="100" x2="1100" y2="100" stroke="url(#timelineBar)" stroke-width="4" stroke-linecap="round"/>

  <!-- 4077 BC - first recordable date -->
  <line x1="1100" y1="96" x2="1100" y2="104" stroke="#ffd966" stroke-width="2"/>
  <text x="1100" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffd966">4077 BC</text>
  <text x="1100" y="148" text-anchor="middle" font-size="10" fill="#c9a227">Creation  first recordable date</text>
</svg>
